name: secret-scan
# Required pre-merge secret gate (Onchain Bridges Code-Provenance-Audit).
# Runs on every PR and push. The native scan BLOCKS on any hit; gitleaks is an
# advisory maintained second layer. Make this a REQUIRED status check in branch
# protection so a failing scan physically blocks merge.
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Native secret scan (BLOCKING)
        run: bash scripts/secret-scan-ci.sh .

      - name: gitleaks (advisory, maintained ruleset)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
